name: CI

on:
  push:
    branches:
      - main
      - develop
      - "release/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  django:
    name: Django and assets
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nfl_squares_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres -d nfl_squares_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SECRET_KEY: ci-only-secret-key-4e2c6bd40dfc4bfe8cf510f9123ef2e0
      APP_ENV: dev
      DEBUG: "False"
      ALLOWED_HOSTS: localhost,127.0.0.1,testserver
      USE_SQLITE: "False"
      DB_NAME: nfl_squares_ci
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      SITE_URL: http://localhost:8000
      SECURE_SSL_REDIRECT: "False"
      SESSION_COOKIE_SECURE: "False"
      CSRF_COOKIE_SECURE: "False"
      SECURE_HSTS_SECONDS: "0"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Python dependencies
        run: pip install -r requirements.txt pip-audit

      - name: Install Node dependencies
        run: npm ci

      - name: Build CSS assets
        run: npm run build:css

      - name: Audit dependencies
        run: |
          pip-audit -r requirements.txt
          npm audit --audit-level=high

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run migrations
        run: python manage.py migrate --noinput

      - name: Run tests
        run: python manage.py test

      - name: Run production deployment checks
        env:
          APP_ENV: prod
          EMAIL_BACKEND: django.core.mail.backends.smtp.EmailBackend
          EMAIL_HOST_USER: ci@example.com
          EMAIL_HOST_PASSWORD: ci-only-placeholder
          SECURE_SSL_REDIRECT: "True"
          SESSION_COOKIE_SECURE: "True"
          CSRF_COOKIE_SECURE: "True"
          SECURE_HSTS_SECONDS: "3600"
          SECURE_HSTS_INCLUDE_SUBDOMAINS: "True"
          SECURE_HSTS_PRELOAD: "True"
        run: python manage.py check --deploy --fail-level WARNING

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: django
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t nfl-squares:${{ github.sha }} .
